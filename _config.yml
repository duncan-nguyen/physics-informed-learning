title: Physics-Informed Learning Lab
author: Duncan Nguyen
only_build_toc_files: true

exclude_patterns:
  - _build
  - .DS_Store
  - Thumbs.db
  - .venv
  - physics_informed_learning.egg-info

execute:
  execute_notebooks: auto
  timeout: 300
  allow_errors: false

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist

repository:
  url: https://github.com/duncan-nguyen/physics-informed-learning
  branch: main
  path_to_book: .

html:
  use_repository_button: true
  use_edit_page_button: true
  use_issues_button: true
  home_page_in_navbar: false
  extra_css:
    - _static/site.css

sphinx:
  config:
    html_show_copyright: false
    html_last_updated_fmt: "%Y-%m-%d"
