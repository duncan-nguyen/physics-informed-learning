project:
  type: website
  output-dir: site-quarto
  render:
    - docs/index.md
    - docs/00_Lab_Guide/*.ipynb
    - docs/01_Core_Path/*.ipynb
    - docs/10_Research_Tracks/**/*.ipynb
    - docs/20_Frontier_Notes/*.ipynb

website:
  title: Physics-Informed Learning Lab
  description: A notebook-first path from PDE baselines to operator learning and frontier scientific ML
  repo-url: https://github.com/duncan-nguyen/physics-informed-learning
  repo-actions: [edit, issue]
  sidebar:
    style: docked
    search: true
    collapse-level: 2
    contents:
      - href: docs/index.md
        text: Home
      - section: Lab Guide
        contents:
          - href: docs/00_Lab_Guide/01_repo_map_and_experiment_protocol.ipynb
            text: Repo Map and Protocol
      - section: Core Path
        contents:
          - href: docs/01_Core_Path/01_pde_primer_and_numerical_methods.ipynb
            text: PDE Primer and Numerical Methods
          - href: docs/01_Core_Path/02_vanilla_pinn_forward_problems.ipynb
            text: Vanilla PINN Forward Problems
          - href: docs/01_Core_Path/03_boundary_and_initial_conditions.ipynb
            text: Boundary and Initial Conditions
          - href: docs/01_Core_Path/04_loss_landscape_and_training_dynamics.ipynb
            text: Loss Landscape and Training Dynamics
          - href: docs/01_Core_Path/05_residual_based_adaptive_sampling.ipynb
            text: Residual-based Adaptive Sampling
          - href: docs/01_Core_Path/06_multi_scale_pinns.ipynb
            text: Multi-scale PINNs
          - href: docs/01_Core_Path/07_parameter_identification_with_pinns.ipynb
            text: Parameter Identification with PINNs
          - href: docs/01_Core_Path/08_deeponet_from_scratch.ipynb
            text: DeepONet from Scratch
          - href: docs/01_Core_Path/09_fourier_neural_operator.ipynb
