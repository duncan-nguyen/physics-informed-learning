project:
  type: book
  output-dir: _book

book:
  title: "Physics-Informed Learning Lab"
  subtitle: "A notebook-first path from PDE baselines to operator learning and frontier scientific ML"
  author: "Duncan Nguyen"
  description: "A modern academic website for studying physics-informed machine learning through executable notebooks, research tracks, and literature-first frontier notes."
  repo-url: https://github.com/duncan-nguyen/physics-informed-learning
  repo-branch: main
  repo-actions: [edit, issue, source]
  site-url: https://duncan-nguyen.github.io/physics-informed-learning/
  favicon: theme/labmark.svg
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  open-graph: true
  twitter-card: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    border: false
    background: "#0b132b"
    foreground: "#e2e8f0"
    logo: theme/labmark.svg
    logo-alt: "Physics-Informed Learning Lab"
    tools:
      - icon: github
        href: https://github.com/duncan-nguyen/physics-informed-learning
        aria-label: GitHub repository
  page-footer:
    border: false
    background: "#0b132b"
    foreground: "#cbd5e1"
    left: "Physics-Informed Learning Lab"
    right: "[GitHub](https://github.com/duncan-nguyen/physics-informed-learning) · Built with Quarto"
  chapters:
    - index.qmd
    - part: "Lab Guide"
      chapters:
        - 00_Lab_Guide/01_repo_map_and_experiment_protocol.ipynb
    - part: "Core Path"
      chapters:
        - 01_Core_Path/01_pde_primer_and_numerical_methods.ipynb
        - 01_Core_Path/02_vanilla_pinn_forward_problems.ipynb
        - 01_Core_Path/03_boundary_and_initial_conditions.ipynb
        - 01_Core_Path/04_loss_landscape_and_training_dynamics.ipynb
        - 01_Core_Path/05_residual_based_adaptive_sampling.ipynb
        - 01_Core_Path/06_multi_scale_pinns.ipynb
        - 01_Core_Path/07_parameter_identification_with_pinns.ipynb
        - 01_Core_Path/08_deeponet_from_scratch.ipynb
        - 01_Core_Path/09_fourier_neural_operator.ipynb
    - part: "Research Tracks · Foundations Extensions"
      chapters:
        - 10_Research_Tracks/01_foundations_extensions/01_automatic_differentiation_for_physics.ipynb
        - 10_Research_Tracks/01_foundations_extensions/02_spectral_methods_and_fourier_analysis.ipynb
        - 10_Research_Tracks/01_foundations_extensions/03_neural_network_function_approximation.ipynb
    - part: "Research Tracks · Advanced PINNs"
      chapters:
        - 10_Research_Tracks/02_advanced_pinns/01_adaptive_activation_functions.ipynb
        - 10_Research_Tracks/02_advanced_pinns/02_domain_decomposition_xpinn_cpinn.ipynb
        - 10_Research_Tracks/02_advanced_pinns/03_transfer_learning_and_meta_pinns.ipynb
    - part: "Research Tracks · Operator Extensions"
      chapters:
        - 10_Research_Tracks/03_operator_extensions/01_physics_informed_neural_operators.ipynb
        - 10_Research_Tracks/03_operator_extensions/02_latent_and_transformer_neural_operators.ipynb
    - part: "Research Tracks · Structure-Preserving Networks"
      chapters:
        - 10_Research_Tracks/04_structure_preserving_networks/01_hamiltonian_neural_networks.ipynb
        - 10_Research_Tracks/04_structure_preserving_networks/02_lagrangian_neural_networks.ipynb
        - 10_Research_Tracks/04_structure_preserving_networks/03_neural_ode_and_continuous_dynamics.ipynb
        - 10_Research_Tracks/04_structure_preserving_networks/04_symplectic_and_volume_preserving_nets.ipynb
    - part: "Research Tracks · Inverse and Discovery"
      chapters:
        - 10_Research_Tracks/05_inverse_and_discovery/01_sindy_sparse_equation_discovery.ipynb
        - 10_Research_Tracks/05_inverse_and_discovery/02_symbolic_regression_for_physics.ipynb
        - 10_Research_Tracks/05_inverse_and_discovery/03_data_driven_discovery_of_conservation_laws.ipynb
    - part: "Research Tracks · Scalable Methods"
      chapters:
        - 10_Research_Tracks/06_scalable_methods/01_causal_training_and_temporal_causality.ipynb
        - 10_Research_Tracks/06_scalable_methods/02_separable_pinns_and_efficiency.ipynb
        - 10_Research_Tracks/06_scalable_methods/03_kolmogorov_arnold_networks_for_pdes.ipynb
        - 10_Research_Tracks/06_scalable_methods/04_large_scale_scientific_computing.ipynb
    - part: "Frontier Notes"
      chapters:
        - 20_Frontier_Notes/01_pinnsformer_and_attention_pde_solvers.ipynb
        - 20_Frontier_Notes/02_diffusion_models_for_scientific_computing.ipynb
        - 20_Frontier_Notes/03_in_context_operator_learning.ipynb
        - 20_Frontier_Notes/04_foundation_models_for_pdes.ipynb

format:
  html:
    theme:
      - cosmo
      - theme/quarto.scss
    toc: true
    toc-depth: 3
    number-depth: 1
    code-copy: true
    smooth-scroll: true
    anchor-sections: true
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true
