[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-informed-learning"
version = "0.1.0"
description = "A notebook-driven course on physics-informed machine learning — from PDE fundamentals to SOTA methods."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Duncan Nguyen"},
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "sympy>=1.12",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "tqdm>=4.65",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "quarto-cli>=1.8.27",
]
